<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest - Master Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #080c14; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Mascota Animada e Interactiva */
        .pet-anim { animation: breathe 3s infinite ease-in-out; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .pet-anim:active { transform: scale(0.8) rotate(5deg); }
        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(16,185,129,0.2)); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 10px 20px rgba(16,185,129,0.4)); }
        }

        .heart-pop { position: absolute; pointer-events: none; animation: floatUp 0.8s forwards; font-size: 1.5rem; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

        .progress-ring { transition: stroke-dashoffset 0.5s; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .calendar-day { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; transition: 0.3s; }
        .day-done { background: #10b981; color: #080c14; font-weight: bold; box-shadow: 0 0 10px rgba(16,185,129,0.4); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-12">

    <!-- Header con Racha y Nivel -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-2">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="app_logo.png" class="w-12 h-12 rounded-2xl object-cover border border-emerald-500/30">
                <span id="lvl-tag" class="absolute -bottom-1 -right-1 bg-yellow-500 text-[9px] px-1.5 py-0.5 rounded-full text-black font-black">LVL 1</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-emerald-400 leading-none">FastQuest</h1>
                <p class="text-[9px] text-slate-500 tracking-widest uppercase">Mascota & Logros</p>
            </div>
        </div>
        <div class="text-right">
            <div class="flex items-center gap-1.5 bg-orange-500/10 px-3 py-1.5 rounded-full border border-orange-500/20">
                <span class="text-orange-500 text-xs font-bold">🔥 <span id="streak-count">0</span> DÍAS</span>
            </div>
        </div>
    </div>

    <!-- Sección Mascota Interactiva -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6 flex flex-col items-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-30"></div>
        <div class="relative mb-4" onclick="handlePetTouch(event)">
            <div id="pet-avatar" class="text-7xl pet-anim">🦊</div>
            <div id="effects-layer"></div>
        </div>
        <div class="bg-slate-900/60 p-4 rounded-2xl w-full border border-white/5">
            <p id="pet-bubble" class="text-center text-sm text-slate-200 italic leading-snug">"¡Hola! Tócame para recibir sabiduría ancestral."</p>
        </div>
    </div>

    <!-- Timer Principal -->
    <div class="glass p-6 rounded-[2.5rem] w-full max-w-md text-center mb-6 shadow-2xl">
        <div class="mb-4">
            <select id="plan" class="bg-slate-800 text-white text-xs p-2 rounded-xl border border-slate-700 outline-none">
                <option value="16">Plan 16:8 - Estándar</option>
                <option value="18">Plan 18:6 - Avanzado</option>
                <option value="20">Plan 20:4 - Guerrero</option>
            </select>
        </div>

        <div class="relative flex items-center justify-center mb-6">
            <svg class="w-52 h-52">
                <circle class="text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="95" cx="104" cy="104"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="8" stroke-dasharray="597" stroke-dashoffset="597" stroke-linecap="round" stroke="currentColor" fill="transparent" r="95" cx="104" cy="104"/>
            </svg>
            <div class="absolute">
                <span id="timer" class="text-4xl font-light">00:00:00</span>
                <p id="phase-label" class="text-[9px] text-emerald-400 font-bold uppercase tracking-tighter mt-1">Listo</p>
            </div>
        </div>

        <button id="btn-action" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-black text-sm tracking-widest transition-all active:scale-95">
            INICIAR AYUNO
        </button>
    </div>

    <!-- Calendario de Logros -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Historial de Misiones</h3>
        <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
    </div>

    <!-- Modal Tiempo -->
    <div id="time-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 hidden items-center justify-center p-6">
        <div class="glass p-8 rounded-[3rem] w-full max-w-xs text-center border border-emerald-500/20">
            <h3 class="text-xl font-bold mb-6">¿Cuándo empezaste?</h3>
            <input type="time" id="start-time-input" class="bg-slate-800 text-white text-4xl p-4 rounded-2xl w-full text-center mb-8 border border-emerald-500/50 outline-none">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 text-slate-500 text-sm">CANCELAR</button>
                <button id="modal-confirm" class="flex-1 bg-emerald-600 py-4 rounded-xl font-bold text-sm">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <script>
        // --- MOTOR DE CONSEJOS INFINITOS ---
        const generator = {
            sujetos: ["Tu cuerpo", "Tus células", "Tu energía", "Tu metabolismo", "Tu mente"],
            acciones: ["está eliminando toxinas", "está reparando ADN", "está usando grasa vieja", "está rejuveneciendo", "está ganando enfoque"],
            beneficios: ["mientras bebes agua.", "gracias a tu disciplina.", "porque eres una máquina.", "en este mismo instante.", "¡sigue así!"],
            random: function() {
                const s = this.sujetos[Math.floor(Math.random()*this.sujetos.length)];
                const a = this.acciones[Math.floor(Math.random()*this.acciones.length)];
                const b = this.beneficios[Math.floor(Math.random()*this.beneficios.length)];
                return `"${s} ${a} ${b}"`;
            }
        };

        const timerEl = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const circum = 95 * 2 * Math.PI;
        let isFasting = false;

        function handlePetTouch(e) {
            // Efecto de corazón[span_1](start_span)[span_1](end_span)
            const heart = document.createElement('div');
            heart.innerText = '✨';
            heart.className = 'heart-pop';
            heart.style.left = `${e.offsetX}px`;
            document.getElementById('effects-layer').appendChild(heart);
            setTimeout(() => heart.remove(), 800);

            // Consejo dinámico[span_2](start_span)[span_2](end_span)
            document.getElementById('pet-bubble').innerText = generator.random();
        }

        function updateUI() {
            const start = localStorage.getItem('fastingStartTime');
            if(!start) return;

            const diff = Math.floor((new Date() - new Date(parseInt(start))) / 1000);
            const hours = diff / 3600;

            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;

            const plan = parseInt(document.getElementById('plan').value);
            const progress = Math.min(diff / (plan * 3600), 1);
            progressBar.style.strokeDashoffset = circum - (progress * circum);

            // Fases y Evolución Mascota
            const pet = document.getElementById('pet-avatar');
            const tag = document.getElementById('phase-label');
            if(hours < 12) { pet.innerText = "🦊"; tag.innerText = "Digestión"; }
            else if(hours < 16) { pet.innerText = "🐯"; tag.innerText = "Quema Grasa"; }
            else { pet.innerText = "🐲"; tag.innerText = "Autofagia"; }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
            const racha = Object.keys(logs).length;
            
            document.getElementById('streak-count').innerText = racha;
            document.getElementById('lvl-tag').innerText = `LVL ${Math.floor(racha/3)+1}`;

            for(let i = 1; i <= 31; i++) {
                const day = document.createElement('div');
                day.className = `calendar-day ${logs[i] ? 'day-done' : 'bg-slate-900 text-slate-700'}`;
                day.innerText = i;
                grid.appendChild(day);
            }
        }

        document.getElementById('btn-action').addEventListener('click', () => {
            if(!isFasting) {
                document.getElementById('time-modal').style.display = 'flex';
                const now = new Date();
                document.getElementById('start-time-input').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
                if ("Notification" in window) Notification.requestPermission();
            } else {
                if(confirm("¿Finalizar misión y registrar día?")) {
                    const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
                    logs[new Date().getDate()] = true;
                    localStorage.setItem('fastingLogs', JSON.stringify(logs));
                    localStorage.removeItem('fastingStartTime');
                    location.reload();
                }
            }
        });

        document.getElementById('modal-confirm').addEventListener('click', () => {
            const [h, m] = document.getElementById('start-time-input').value.split(':');
            const d = new Date(); d.setHours(h, m, 0);
            if(d > new Date()) d.setDate(d.getDate()-1);
            localStorage.setItem('fastingStartTime', d.getTime());
            location.reload();
        });

        function closeModal() { document.getElementById('time-modal').style.display = 'none'; }

        window.onload = () => {
            if(localStorage.getItem('fastingStartTime')) {
                isFasting = true;
                document.getElementById('btn-action').innerText = "FINALIZAR MISION";
                document.getElementById('btn-action').className = "w-full bg-orange-600 py-4 rounded-2xl font-black text-sm transition-all";
                setInterval(updateUI, 1000);
                updateUI();
            }
            renderCalendar();
        };
    </script>
</body>
</html>
