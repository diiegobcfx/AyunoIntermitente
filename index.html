<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest AI - Biohack Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #010409; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .ai-glow { border: 2px solid #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        .progress-ring { transition: stroke-dashoffset 0.8s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .pet { cursor: pointer; transition: transform 0.2s; display: inline-block; }
        .pet:active { transform: scale(0.9); }
        .card-stats { background: rgba(255,255,255,0.03); border-radius: 1.5rem; padding: 1rem; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-20">

    <!-- Header HUD -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-4 px-2">
        <div class="flex flex-col">
            <h1 class="text-2xl font-black italic tracking-tighter">FASTQUEST <span class="text-emerald-500">BIO</span></h1>
            <div id="status-text" class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest">Sincronizado</div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('api-modal').classList.remove('hidden')" class="p-3 bg-white/5 rounded-xl border border-white/10 text-sm">⚙️</button>
        </div>
    </div>

    <!-- IA Module -->
    <div id="ai-box" class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6 flex flex-col items-center text-center relative border border-white/10">
        <div id="pet-avatar" class="text-7xl pet mb-4" onclick="getAdvice()">🦊</div>
        <p id="ai-bubble" class="text-xs font-medium leading-relaxed text-emerald-50 italic px-4">
            "Toca mi cabeza para recibir instrucciones de misión."
        </p>
    </div>

    <!-- Main Quest Card -->
    <div class="glass p-8 rounded-[3.5rem] w-full max-w-md text-center shadow-2xl relative border border-white/10 mb-6">
        <div class="flex justify-center mb-4 gap-4">
            <select id="fast-goal" class="bg-black text-[10px] font-black border border-emerald-500/30 rounded-full px-4 py-1 uppercase tracking-widest text-emerald-500 outline-none">
                <option value="16">Modo 16:8</option>
                <option value="18">Modo 18:6</option>
                <option value="20">Modo 20:4</option>
            </select>
        </div>
        
        <div class="relative flex items-center justify-center mb-6">
            <svg class="w-56 h-56">
                <circle class="text-slate-900" stroke-width="8" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="10" stroke-dasharray="628" stroke-dashoffset="628" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="timer-display" class="text-4xl font-light tracking-tighter">00:00:00</span>
                <span id="phase-label" class="text-[9px] font-black text-emerald-500/50 uppercase mt-2 tracking-[0.2em]">Standby</span>
            </div>
        </div>

        <button id="action-btn" onclick="toggleFast()" class="w-full bg-emerald-600 py-5 rounded-2xl font-black text-[10px] tracking-[0.3em] uppercase active:scale-95 transition-all">
            Iniciar Ayuno
        </button>
    </div>

    <!-- Bio-Stats Grid -->
    <div class="grid grid-cols-2 gap-4 w-full max-w-md">
        <!-- Hidratación -->
        <div class="card-stats flex flex-col items-center justify-center">
            <span class="text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Agua (250ml)</span>
            <div class="flex items-center gap-3">
                <button onclick="updateWater(-1)" class="text-xl opacity-50 hover:opacity-100">−</button>
                <span id="water-count" class="text-2xl font-black text-blue-400">0</span>
                <button onclick="updateWater(1)" class="text-xl opacity-50 hover:opacity-100">+</button>
            </div>
        </div>
        <!-- Último Ayuno -->
        <div class="card-stats flex flex-col items-center justify-center">
            <span class="text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Último Récord</span>
            <span id="last-record" class="text-xl font-black text-emerald-400">0.0h</span>
        </div>
    </div>

    <!-- Modal API -->
    <div id="api-modal" class="fixed inset-0 z-50 glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2rem] border border-emerald-500 w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-4">API CONFIG</h2>
            <input type="password" id="api-input" placeholder="gsk_..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-emerald-500 mb-4 outline-none text-center">
            <button onclick="saveKey()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold">GUARDAR</button>
            <button onclick="document.getElementById('api-modal').classList.add('hidden')" class="mt-4 text-[9px] uppercase font-black text-slate-500">Cerrar</button>
        </div>
    </div>

    <script>
        const ringLength = 628;
        let isRunning = false;
        let water = 0;

        // --- SISTEMA IA ---
        async function getAdvice() {
            const key = localStorage.getItem('fast_key');
            const bubble = document.getElementById('ai-bubble');
            if (!key) { document.getElementById('api-modal').classList.remove('hidden'); return; }

            bubble.innerText = "Analizando metabolismo...";
            const start = localStorage.getItem('fast_start_time');
            const hours = start ? ((Date.now() - parseInt(start)) / 1000 / 3600).toFixed(1) : 0;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "system", content: "Eres un mentor biohacker. Da un consejo de 10 palabras sobre ayuno e hidratación." },
                                   { role: "user", content: `Llevo ${hours} horas de ayuno.` }]
                    })
                });
                const data = await response.json();
                bubble.innerText = `"${data.choices[0].message.content}"`;
            } catch (err) {
                bubble.innerText = "Consejo: Mantente hidratado con agua mineral para evitar fatiga.";
            }
        }

        function saveKey() {
            const val = document.getElementById('api-input').value.trim();
            if (val.startsWith('gsk_')) { localStorage.setItem('fast_key', val); location.reload(); }
        }

        // --- HIDRATACIÓN ---
        function updateWater(val) {
            water = Math.max(0, water + val);
            document.getElementById('water-count').innerText = water;
            localStorage.setItem('daily_water', water);
        }

        // --- AYUNO ---
        function toggleFast() {
            if (!isRunning) {
                const h = prompt("¿Hora de última comida? (HH:MM):", `${new Date().getHours()}:${new Date().getMinutes().toString().padStart(2,'0')}`);
                if (h && h.includes(':')) {
                    const [hrs, mins] = h.split(':');
                    const startDate = new Date();
                    startDate.setHours(parseInt(hrs), parseInt(mins), 0);
                    if (startDate > new Date()) startDate.setDate(startDate.getDate() - 1);
                    localStorage.setItem('fast_start_time', startDate.getTime());
                    location.reload();
                }
            } else {
                if (confirm("¿Finalizar ayuno?")) {
                    const duration = ((Date.now() - parseInt(localStorage.getItem('fast_start_time'))) / 1000 / 3600).toFixed(1);
                    localStorage.setItem('last_fast_record', duration);
                    localStorage.removeItem('fast_start_time');
                    location.reload();
                }
            }
        }

        function updateUI() {
            const start = localStorage.getItem('fast_start_time');
            const goal = parseInt(document.getElementById('fast-goal').value);
            
            // Cargar datos guardados
            document.getElementById('water-count').innerText = localStorage.getItem('daily_water') || 0;
            document.getElementById('last-record').innerText = (localStorage.getItem('last_fast_record') || 0) + "h";

            if (!start) return;

            isRunning = true;
            document.getElementById('action-btn').innerText = "Finalizar Misión";
            document.getElementById('action-btn').classList.replace('bg-emerald-600', 'bg-red-900/50');

            setInterval(() => {
                const diff = Math.floor((Date.now() - parseInt(start)) / 1000);
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;

                document.getElementById('timer-display').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                const progress = Math.min(h / goal, 1);
                document.getElementById('progress-bar').style.strokeDashoffset = ringLength - (progress * ringLength);

                const label = document.getElementById('phase-label');
                if (h < 12) label.innerText = "Digestión";
                else if (h < goal) label.innerText = "Quema Grasa";
                else label.innerText = "Autofagia";
            }, 1000);
        }

        window.onload = updateUI;
    </script>
</body>
</html>
