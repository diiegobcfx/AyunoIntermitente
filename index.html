<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest AI - Secure Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #010409; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .ai-card { border: 2px solid #10b981; box-shadow: 0 0 50px rgba(16, 185, 129, 0.15); }
        .pet-anim { animation: breathe 4s infinite ease-in-out; cursor: pointer; }
        @keyframes breathe { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #10b981); } 50% { transform: scale(1.1); filter: drop-shadow(0 10px 40px #10b981); } }
        .progress-ring { transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-12">

    <!-- Configuración Segura de API -->
    <div id="setup-panel" class="fixed inset-0 z-50 glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-emerald-500/30 w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-4 text-emerald-400">CONFIGURACIÓN IA</h2>
            <p class="text-xs text-slate-400 mb-6">Pega tu API Key de Groq. Se guardará localmente en tu dispositivo y GitHub no podrá verla.</p>
            <input type="password" id="api-input" placeholder="gsk_..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-emerald-500 mb-4 outline-none focus:border-emerald-500">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold text-sm tracking-widest">ACTIVAR CEREBRO</button>
        </div>
    </div>

    <!-- HUD principal -->
    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4 px-2">
        <div class="flex flex-col">
            <span id="ai-label" class="text-[9px] font-black tracking-widest text-red-500 uppercase">IA DESCONECTADA</span>
            <h1 class="text-xl font-black italic">FASTQUEST <span class="text-emerald-500 underline">AI</span></h1>
        </div>
        <button onclick="document.getElementById('setup-panel').classList.remove('hidden')" class="text-[10px] bg-white/5 px-3 py-1 rounded-full border border-white/10 hover:bg-white/10">⚙️ Ajustes</button>
    </div>

    <!-- Módulo IA -->
    <div id="ai-container" class="glass ai-card w-full max-w-md p-8 rounded-[3rem] mb-6 flex flex-col items-center text-center relative">
        <div class="absolute top-6 left-6">
            <div id="water-count" class="text-xl font-black text-blue-500">0</div>
            <div class="text-[8px] font-bold text-blue-400 uppercase">Vasos H2O</div>
        </div>
        <div onclick="addWater()" class="absolute top-6 right-6 cursor-pointer hover:scale-125 transition-transform text-3xl">💧</div>

        <div id="pet-avatar" class="text-8xl pet-anim mb-6" onclick="askExpertIA()">🦊</div>
        
        <div class="bg-black/40 p-5 rounded-2xl w-full border border-white/5 min-h-[110px] flex items-center justify-center">
            <p id="ai-bubble" class="text-sm font-medium leading-relaxed text-slate-200 italic">"Conecta mi cerebro para iniciar el análisis biohacker."</p>
        </div>
    </div>

    <!-- Timer -->
    <div class="glass p-10 rounded-[4rem] w-full max-w-md text-center shadow-2xl relative">
        <div class="relative flex items-center justify-center mb-10">
            <svg class="w-64 h-64">
                <circle class="text-slate-900" stroke-width="14" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="14" stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="timer" class="text-5xl font-light tracking-tighter">00:00:00</span>
                <div id="phase-badge" class="mt-4 px-4 py-1 bg-emerald-500/10 text-emerald-500 text-[10px] font-black uppercase tracking-widest rounded-full border border-emerald-500/20">Standby</div>
            </div>
        </div>
        <button id="main-btn" onclick="toggleQuest()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-3xl font-black text-xs tracking-[0.2em] shadow-xl active:scale-95 transition-all">INICIAR AYUNO</button>
    </div>

    <script>
        const circum = 110 * 2 * Math.PI;
        let isFasting = false;

        // Gestión de API Key Segura
        function saveApiKey() {
            const key = document.getElementById('api-input').value;
            if(key.startsWith('gsk_')) {
                localStorage.setItem('groq_secure_key', key);
                location.reload();
            } else {
                alert("Por favor, introduce una clave válida de Groq.");
            }
        }

        async function askExpertIA() {
            const key = localStorage.getItem('groq_secure_key');
            if(!key) {
                document.getElementById('setup-panel').classList.remove('hidden');
                return;
            }

            const bubble = document.getElementById('ai-bubble');
            bubble.innerText = "Consultando redes neuronales...";

            const start = localStorage.getItem('fastingStartTime');
            const hours = start ? ((new Date() - new Date(parseInt(start))) / 1000 / 3600).toFixed(1) : 0;
            const water = localStorage.getItem('fastingWater') || 0;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "system", content: "Eres un mentor biohacker. Responde en 12 palabras máximo. Contexto: Ayuno: "+hours+"h, Agua: "+water+" vasos." },
                                   { role: "user", content: "Analiza mi estado." }],
                        temperature: 0.6
                    })
                });
                const data = await response.json();
                bubble.innerText = `"${data.choices[0].message.content}"`;
            } catch (e) {
                bubble.innerText = "Error de conexión. Revisa tu API Key.";
            }
        }

        // --- FUNCIONALIDAD BASE ---
        function toggleQuest() {
            if (!isFasting) {
                const time = prompt("Hora inicio (HH:MM):", new Date().getHours()+":"+new Date().getMinutes());
                if (time) {
                    const [h, m] = time.split(':');
                    const d = new Date(); d.setHours(h, m, 0);
                    if (d > new Date()) d.setDate(d.getDate() - 1);
                    localStorage.setItem('fastingStartTime', d.getTime());
                    location.reload();
                }
            } else {
                if (confirm("¿Terminar misión?")) {
                    localStorage.removeItem('fastingStartTime');
                    localStorage.removeItem('fastingWater');
                    location.reload();
                }
            }
        }

        function addWater() {
            let w = parseInt(localStorage.getItem('fastingWater') || 0) + 1;
            localStorage.setItem('fastingWater', w);
            document.getElementById('water-count').innerText = w;
            askExpertIA();
        }

        window.onload = () => {
            const key = localStorage.getItem('groq_secure_key');
            if(key) {
                document.getElementById('ai-label').innerText = "IA GROQ CONECTADA";
                document.getElementById('ai-label').classList.replace('text-red-500', 'text-emerald-500');
            }

            const saved = localStorage.getItem('fastingStartTime');
            if (saved) {
                isFasting = true;
                document.getElementById('main-btn').innerText = "FINALIZAR MISIÓN";
                document.getElementById('main-btn').classList.replace('bg-emerald-600', 'bg-orange-700');
                setInterval(() => {
                    const diff = Math.floor((new Date() - new Date(parseInt(saved))) / 1000);
                    const hours = diff / 3600;
                    document.getElementById('timer').innerText = `${Math.floor(hours).toString().padStart(2, '0')}:${Math.floor((diff%3600)/60).toString().padStart(2, '0')}:${(diff%60).toString().padStart(2, '0')}`;
                    document.getElementById('progress-bar').style.strokeDashoffset = circum - (Math.min(hours/16, 1) * circum);
                }, 1000);
            }
            document.getElementById('water-count').innerText = localStorage.getItem('fastingWater') || 0;
        };
    </script>
</body>
</html>
