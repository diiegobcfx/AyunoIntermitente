<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest AI - Final Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #010409; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .ai-glow { border: 2px solid #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        .progress-ring { transition: stroke-dashoffset 0.8s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .pet { cursor: pointer; transition: transform 0.2s; display: inline-block; }
        .pet:active { transform: scale(0.9); }
        .thinking { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-12">

    <!-- Modal de Configuración -->
    <div id="api-modal" class="fixed inset-0 z-50 glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2rem] border border-emerald-500/50 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-xl font-black mb-2 text-emerald-400">ENLACE NEURAL</h2>
            <p class="text-[10px] text-slate-400 mb-6 uppercase tracking-widest">Pega tu clave de Groq (gsk_...)</p>
            <input type="password" id="api-input" placeholder="gsk_xxxxxxxxxxxx" 
                   class="w-full bg-black border border-emerald-500/30 p-4 rounded-xl text-emerald-500 mb-4 outline-none focus:border-emerald-500 transition-all text-center">
            <button onclick="saveKey()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold tracking-widest transition-colors shadow-lg shadow-emerald-900/20">ACTIVAR IA</button>
            <button onclick="closeModal()" class="mt-4 text-[9px] text-slate-500 uppercase font-bold tracking-widest">Cerrar</button>
        </div>
    </div>

    <!-- Header HUD -->
    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4 px-2">
        <div class="flex flex-col">
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></div>
                <span id="status-text" class="text-[9px] font-black text-slate-500 uppercase tracking-widest text-emerald-500">Sistema Offline</span>
            </div>
            <h1 class="text-2xl font-black italic tracking-tighter">FASTQUEST <span class="text-emerald-500 underline">AI</span></h1>
        </div>
        <button onclick="openModal()" class="p-3 bg-white/5 rounded-2xl border border-white/10 hover:bg-white/20 transition-all">⚙️</button>
    </div>

    <!-- Avatar y Burbuja IA -->
    <div id="ai-box" class="glass w-full max-w-md p-8 rounded-[3rem] mb-6 flex flex-col items-center text-center relative transition-all duration-500">
        <div id="pet-avatar" class="text-8xl pet mb-6 select-none" onclick="getAdvice()">🦊</div>
        <div class="bg-black/50 p-6 rounded-2xl w-full border border-white/5 min-h-[110px] flex items-center justify-center shadow-inner">
            <p id="ai-bubble" class="text-sm font-medium leading-relaxed text-emerald-50 italic">
                "Inicia tu misión o tócame para sincronizar datos."
            </p>
        </div>
    </div>

    <!-- Timer principal -->
    <div class="glass p-8 rounded-[4rem] w-full max-w-md text-center shadow-2xl relative border-t border-white/10">
        <div class="relative flex items-center justify-center mb-8">
            <svg class="w-64 h-64">
                <circle class="text-slate-900" stroke-width="10" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="10" stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="timer-display" class="text-5xl font-light tracking-tighter mb-1">00:00:00</span>
                <div id="phase-badge" class="px-3 py-1 bg-emerald-500/10 text-emerald-500 text-[9px] font-black uppercase tracking-[0.2em] rounded-full border border-emerald-500/20">Standby</div>
            </div>
        </div>

        <button id="action-btn" onclick="toggleFast()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-3xl font-black text-[10px] tracking-[0.3em] shadow-xl active:scale-95 transition-all uppercase">
            Iniciar Protocolo
        </button>
    </div>

    <script>
        const ringLength = 691;
        let isRunning = false;

        // Modales
        const openModal = () => document.getElementById('api-modal').classList.remove('hidden');
        const closeModal = () => document.getElementById('api-modal').classList.add('hidden');

        function saveKey() {
            const val = document.getElementById('api-input').value.trim();
            if (val.startsWith('gsk_')) {
                localStorage.setItem('fast_key', val);
                location.reload();
            } else { alert("Introduce una clave válida"); }
        }

        // Lógica de IA con "Respaldo Offline"
        async function getAdvice() {
            const key = localStorage.getItem('fast_key');
            const bubble = document.getElementById('ai-bubble');
            const avatar = document.getElementById('pet-avatar');

            if (!key) { openModal(); return; }

            // Animación de pensamiento
            bubble.innerText = "Consultando base de datos...";
            avatar.classList.add('thinking');

            const start = localStorage.getItem('fast_start_time');
            const hours = start ? ((Date.now() - parseInt(start)) / 1000 / 3600).toFixed(1) : 0;

            try {
                // Intentamos usar un proxy que suele fallar menos
                const proxy = "https://api.allorigins.win/get?url=";
                const target = "https://api.groq.com/openai/v1/chat/completions";
                
                const body = JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "Eres un experto en biohacking. Da un consejo de 10 palabras sobre ayuno intermitente." },
                        { role: "user", content: `Llevo ${hours} horas de ayuno.` }
                    ]
                });

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: body
                });

                if (!response.ok) throw new Error("CORS_OR_KEY_ERROR");

                const data = await response.json();
                bubble.innerText = `"${data.choices[0].message.content}"`;

            } catch (err) {
                console.warn("Fallo de API, usando lógica offline...");
                // Lógica Offline (Respaldo)
                const consejos = [
                    "Bebe agua mineral para mantener tus electrolitos estables.",
                    "El café solo no rompe el ayuno y mejora la quema de grasa.",
                    "A partir de las 12h, tu cuerpo empieza a usar cetonas.",
                    "La autofagia celular alcanza su pico cerca de las 16 horas.",
                    "Si sientes hambre, camina 10 minutos; la sensación pasará."
                ];
                bubble.innerText = consejos[Math.floor(Math.random() * consejos.length)];
            } finally {
                avatar.classList.remove('thinking');
            }
        }

        // Sistema de Ayuno
        function toggleFast() {
            if (!isRunning) {
                const h = prompt("¿A qué hora comiste por última vez? (Ejemplo: 14:30 o 08:15)", 
                    `${new Date().getHours()}:${new Date().getMinutes().toString().padStart(2,'0')}`);
                
                if (h && h.includes(':')) {
                    const [hrs, mins] = h.split(':');
                    const startDate = new Date();
                    startDate.setHours(parseInt(hrs), parseInt(mins), 0);
                    if (startDate > new Date()) startDate.setDate(startDate.getDate() - 1);
                    
                    localStorage.setItem('fast_start_time', startDate.getTime());
                    location.reload();
                }
            } else {
                if (confirm("¿Finalizar misión y registrar progreso?")) {
                    localStorage.removeItem('fast_start_time');
                    location.reload();
                }
            }
        }

        function updateUI() {
            const start = localStorage.getItem('fast_start_time');
            if (!start) return;

            isRunning = true;
            document.getElementById('action-btn').innerText = "Finalizar Misión";
            document.getElementById('action-btn').classList.replace('bg-emerald-600', 'bg-red-900/50');
            document.getElementById('ai-box').classList.add('ai-glow');

            setInterval(() => {
                const diff = Math.floor((Date.now() - parseInt(start)) / 1000);
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;

                document.getElementById('timer-display').innerText = 
                    `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

                const progress = Math.min(h / 16, 1);
                document.getElementById('progress-bar').style.strokeDashoffset = ringLength - (progress * ringLength);

                const badge = document.getElementById('phase-badge');
                if (h < 12) { badge.innerText = "Digestión"; badge.className = "text-blue-400"; }
                else if (h < 16) { badge.innerText = "Cetosis"; badge.className = "text-orange-400"; }
                else { badge.innerText = "Autofagia"; badge.className = "text-emerald-400"; }
            }, 1000);
        }

        window.onload = () => {
            const key = localStorage.getItem('fast_key');
            if (key) {
                document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-emerald-500');
                document.getElementById('status-text').innerText = "IA Conectada";
                document.getElementById('status-text').classList.add('text-emerald-500');
            }
            updateUI();
        };
    </script>
</body>
</html>
