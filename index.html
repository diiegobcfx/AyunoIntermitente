<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest Pro - Guía Inteligente</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #080c14; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .pet-anim { animation: breathe 3s infinite ease-in-out; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .pet-anim:active { transform: scale(0.85) rotate(-5deg); }
        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 8px rgba(16,185,129,0.2)); }
            50% { transform: translateY(-12px) scale(1.05); filter: drop-shadow(0 15px 25px rgba(16,185,129,0.4)); }
        }
        .particle { position: absolute; pointer-events: none; animation: popUp 0.6s ease-out forwards; font-size: 1.2rem; }
        @keyframes popUp { 0% { transform: scale(0); opacity: 1; } 100% { transform: translateY(-70px) scale(1.5); opacity: 0; } }
        .progress-ring { transition: stroke-dashoffset 0.8s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .calendar-day { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: 0.3s; }
        .day-done { background: linear-gradient(135deg, #10b981, #059669); color: #080c14; font-weight: 800; box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-10">

    <!-- Header -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-4">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="app_logo.png" class="w-12 h-12 rounded-2xl object-cover border border-emerald-500/20 shadow-2xl">
                <span id="lvl-badge" class="absolute -bottom-1 -right-1 bg-yellow-500 text-[10px] px-2 py-0.5 rounded-full text-black font-black">LVL 1</span>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">Fast<span class="text-emerald-400">Quest</span></h1>
        </div>
        <div class="bg-orange-500/10 px-4 py-2 rounded-2xl border border-orange-500/20 flex items-center gap-2">
            <span class="text-orange-500 font-bold text-sm">🔥 <span id="streak-val">0</span> Días</span>
        </div>
    </div>

    <!-- Mascota con IA de Frases -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6 flex flex-col items-center relative overflow-hidden text-center">
        <div class="relative mb-4" onclick="triggerPet(event)">
            <div id="pet-avatar" class="text-7xl pet-anim">🦊</div>
            <div id="particles-container"></div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-2xl w-full border border-white/5 relative">
            <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-slate-900 rotate-45 border-l border-t border-white/5"></div>
            <p id="pet-bubble" class="text-sm text-slate-100 font-medium leading-relaxed italic">"¡Tócame! Tengo mucha curiosidad por tu progreso."</p>
        </div>
    </div>

    <!-- Timer & Plan -->
    <div class="glass p-8 rounded-[3rem] w-full max-w-md text-center mb-6 shadow-2xl relative">
        <select id="plan" class="mb-6 bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-xl border border-slate-700 outline-none w-full">
            <option value="16">16 Horas (Quema Grasa)</option>
            <option value="18">18 Horas (Desintoxicación)</option>
            <option value="20">20 Horas (Autofagia Profunda)</option>
        </select>

        <div class="relative flex items-center justify-center mb-8">
            <svg class="w-60 h-60">
                <circle class="text-slate-800/50" stroke-width="10" stroke="currentColor" fill="transparent" r="110" cx="120" cy="120"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="10" stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" stroke="currentColor" fill="transparent" r="110" cx="120" cy="120"/>
            </svg>
            <div class="absolute flex flex-col">
                <span id="timer" class="text-5xl font-light tracking-tighter">00:00:00</span>
                <span id="phase-tag" class="text-[10px] font-bold text-emerald-400 mt-2 uppercase tracking-widest">Listo</span>
            </div>
        </div>

        <button id="btn-action" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-3xl font-black text-sm tracking-widest shadow-xl transition-all active:scale-95">
            COMENZAR AYUNO
        </button>
    </div>

    <!-- Calendario -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem]">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Registro Mensual</h3>
        <div id="calendar-grid" class="grid grid-cols-7 gap-3"></div>
    </div>

    <!-- Modal Ajuste -->
    <div id="time-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden items-center justify-center p-6">
        <div class="glass p-8 rounded-[3rem] w-full max-w-xs text-center border border-emerald-500/20">
            <h3 class="text-xl font-bold mb-6">¿Cuándo fue tu última comida?</h3>
            <input type="time" id="start-time-input" class="bg-slate-800 text-white text-4xl p-4 rounded-3xl w-full text-center mb-8 border border-emerald-500/50 outline-none">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 text-slate-500 font-bold">CANCELAR</button>
                <button id="modal-confirm" class="flex-1 bg-emerald-600 py-4 rounded-2xl font-bold">EMPEZAR</button>
            </div>
        </div>
    </div>

    <script>
        // --- MOTOR DE SABIDURÍA (FRASES COHERENTES) ---
        const petWisdom = {
            intro: ["¿Sabías que", "Es fascinante ver cómo", "Prepárate porque", "En este momento,", "Me encanta que"],
            cuerpo: ["tu cuerpo está empezando a", "tus células están ocupadas en", "tu metabolismo se está", "tu sistema digestivo está", "tu cerebro se siente"],
            dato: ["reparar tu ADN celular.", "quemar reservas de energía antigua.", "limpiarse de toxinas innecesarias.", "alcanzar un enfoque mental superior.", "producir hormonas de crecimiento."],
            final: ["¡No te detengas!", "¡Bebe un poco de agua!", "¡Eres increíble!", "¡La aventura sigue!", "¡Tu racha está a salvo!"],
            generate: function() {
                const r = (arr) => arr[Math.floor(Math.random() * arr.length)];
                return `"${r(this.intro)} ${r(this.cuerpo)} ${r(this.dato)} ${r(this.final)}"`;
            }
        };

        const timerEl = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const circum = 110 * 2 * Math.PI;
        let isFasting = false;
        let notifiedPhases = new Set();

        function triggerPet(e) {
            const star = document.createElement('div');
            star.innerText = '✨';
            star.className = 'particle';
            star.style.left = `${e.offsetX}px`;
            document.getElementById('particles-container').appendChild(star);
            setTimeout(() => star.remove(), 600);
            document.getElementById('pet-bubble').innerText = petWisdom.generate();
        }

        function sendNotification(title, msg) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: msg, icon: 'app_logo.png' });
            }
        }

        function updateUI() {
            const start = localStorage.getItem('fastingStartTime');
            if(!start) return;

            const diff = Math.floor((new Date() - new Date(parseInt(start))) / 1000);
            const hours = diff / 3600;

            // Timer
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;

            // Progreso
            const plan = parseInt(document.getElementById('plan').value);
            const progress = Math.min(diff / (plan * 3600), 1);
            progressBar.style.strokeDashoffset = circum - (progress * circum);

            // Gestión de Fases y Notificaciones
            const pet = document.getElementById('pet-avatar');
            const tag = document.getElementById('phase-tag');
            
            if (hours < 12) {
                pet.innerText = "🦊";
                tag.innerText = "Digestión Activa";
            } else if (hours < 16) {
                pet.innerText = "🐯";
                tag.innerText = "Quema de Grasa";
                if(!notifiedPhases.has('fat')) {
                    sendNotification("🔥 ¡Fase alcanzada!", "Tu cuerpo ha comenzado a quemar grasa como combustible principal.");
                    notifiedPhases.add('fat');
                }
            } else {
                pet.innerText = "🐲";
                tag.innerText = "Autofagia (Modo Dios)";
                if(!notifiedPhases.has('auto')) {
                    sendNotification("🧬 ¡Estado de Autofagia!", "Tus células están en modo de reparación profunda. ¡Logro desbloqueado!");
                    notifiedPhases.add('auto');
                }
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
            const racha = Object.keys(logs).length;
            
            document.getElementById('streak-val').innerText = racha;
            document.getElementById('lvl-badge').innerText = `LVL ${Math.floor(racha/3)+1}`;

            for(let i = 1; i <= 31; i++) {
                const day = document.createElement('div');
                day.className = `calendar-day ${logs[i] ? 'day-done' : 'bg-slate-900/50 text-slate-700'}`;
                day.innerText = i;
                grid.appendChild(day);
            }
        }

        document.getElementById('btn-action').addEventListener('click', () => {
            if(!isFasting) {
                if ("Notification" in window) Notification.requestPermission();
                document.getElementById('time-modal').style.display = 'flex';
                const now = new Date();
                document.getElementById('start-time-input').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            } else {
                if(confirm("¿Guardar progreso y finalizar?")) {
                    const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
                    logs[new Date().getDate()] = true;
                    localStorage.setItem('fastingLogs', JSON.stringify(logs));
                    localStorage.removeItem('fastingStartTime');
                    location.reload();
                }
            }
        });

        document.getElementById('modal-confirm').addEventListener('click', () => {
            const [h, m] = document.getElementById('start-time-input').value.split(':');
            const d = new Date(); d.setHours(h, m, 0);
            if(d > new Date()) d.setDate(d.getDate()-1);
            localStorage.setItem('fastingStartTime', d.getTime());
            location.reload();
        });

        function closeModal() { document.getElementById('time-modal').style.display = 'none'; }

        window.onload = () => {
            if(localStorage.getItem('fastingStartTime')) {
                isFasting = true;
                document.getElementById('btn-action').innerText = "TERMINAR MISION";
                document.getElementById('btn-action').classList.replace('bg-emerald-600', 'bg-orange-700');
                setInterval(updateUI, 1000);
                updateUI();
            }
            renderCalendar();
        };
    </script>
</body>
</html>
