<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest AI - Final Master Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #010409; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .ai-glow { border: 2px solid #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        .progress-ring { transition: stroke-dashoffset 0.8s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .pet { cursor: pointer; transition: transform 0.2s; }
        .pet:active { transform: scale(0.9); }
        @keyframes pulse-ring { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .loading-ring { animation: pulse-ring 1.5s infinite; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-12">

    <!-- Panel de Configuración de API -->
    <div id="api-modal" class="fixed inset-0 z-50 glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2rem] border border-emerald-500/50 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-xl font-black mb-2 text-emerald-400">CONFIGURAR IA</h2>
            <p class="text-[10px] text-slate-400 mb-6 uppercase tracking-widest">Introduce tu clave de Groq (gsk_...)</p>
            <input type="password" id="api-input" placeholder="Pega tu clave aquí" 
                   class="w-full bg-black border border-emerald-500/30 p-4 rounded-xl text-emerald-500 mb-4 outline-none focus:border-emerald-500 transition-all">
            <button onclick="saveKey()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold tracking-widest transition-colors">ACTIVAR CEREBRO</button>
            <button onclick="closeModal()" class="mt-4 text-[9px] text-slate-500 uppercase font-bold">Cerrar</button>
        </div>
    </div>

    <!-- Header -->
    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4 px-2">
        <div class="flex flex-col">
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></div>
                <span id="status-text" class="text-[10px] font-black text-slate-500 uppercase tracking-widest">IA Desconectada</span>
            </div>
            <h1 class="text-2xl font-black italic tracking-tighter text-white">FASTQUEST <span class="text-emerald-500">PRO</span></h1>
        </div>
        <button onclick="openModal()" class="p-2 bg-white/5 rounded-lg border border-white/10 hover:bg-white/10">⚙️</button>
    </div>

    <!-- Módulo IA -->
    <div id="ai-box" class="glass w-full max-w-md p-8 rounded-[3rem] mb-6 flex flex-col items-center text-center relative transition-all duration-500">
        <div id="pet-avatar" class="text-8xl pet mb-6" onclick="getAdvice()">🦊</div>
        <div class="bg-black/50 p-6 rounded-2xl w-full border border-white/5 min-h-[100px] flex items-center justify-center">
            <p id="ai-bubble" class="text-sm font-medium leading-relaxed text-emerald-50 italic uppercase tracking-tight">
                "Toca al zorro para recibir un análisis de la IA."
            </p>
        </div>
    </div>

    <!-- Timer e Interfaz -->
    <div class="glass p-10 rounded-[4rem] w-full max-w-md text-center shadow-2xl">
        <div class="relative flex items-center justify-center mb-10">
            <svg class="w-64 h-64">
                <circle class="text-slate-900" stroke-width="12" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="12" stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" stroke="currentColor" fill="transparent" r="110" cx="128" cy="128"/>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="timer-display" class="text-5xl font-light tracking-tighter">00:00:00</span>
                <span id="phase-label" class="text-[10px] font-black text-emerald-500/50 uppercase mt-2 tracking-[0.2em]">En Espera</span>
            </div>
        </div>

        <button id="action-btn" onclick="toggleFast()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-3xl font-black text-xs tracking-[0.2em] shadow-xl active:scale-95 transition-all">
            CARGAR DATOS DE MISIÓN
        </button>
    </div>

    <script>
        const ringLength = 691;
        let isRunning = false;

        // Gestión de clave
        function openModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('api-modal').classList.add('hidden'); }
        function saveKey() {
            const val = document.getElementById('api-input').value.trim();
            if (val.startsWith('gsk_')) {
                localStorage.setItem('fastquest_key', val);
                location.reload();
            } else { alert("Clave inválida"); }
        }

        // --- MOTOR IA CON PROXY ANTIBLOQUEO ---
        async function getAdvice() {
            const key = localStorage.getItem('fastquest_key');
            const bubble = document.getElementById('ai-bubble');
            const avatar = document.getElementById('pet-avatar');

            if (!key) { openModal(); return; }

            bubble.innerText = "Sincronizando con puente seguro...";
            avatar.classList.add('animate-pulse');

            const start = localStorage.getItem('fast_start');
            const diff = start ? ((Date.now() - parseInt(start)) / 1000 / 3600).toFixed(1) : 0;

            try {
                // Proxy para evitar error de conexión (CORS)
                const proxy = "https://corsproxy.io/?";
                const target = "https://api.groq.com/openai/v1/chat/completions";

                const response = await fetch(proxy + encodeURIComponent(target), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "Eres un mentor biohacker. Responde en 12 palabras máximo sobre el estado metabólico." },
                            { role: "user", content: `Llevo ${diff} horas de ayuno. Dime qué pasa en mi cuerpo.` }
                        ],
                        temperature: 0.6
                    })
                });

                const data = await response.json();
                if (data.choices) {
                    bubble.innerText = `"${data.choices[0].message.content}"`;
                } else { throw new Error(); }
            } catch (err) {
                bubble.innerText = "Error de conexión. Verifica tu clave o tu saldo en Groq.";
            } finally { avatar.classList.remove('animate-pulse'); }
        }

        // --- LÓGICA DE AYUNO ---
        function toggleFast() {
            if (!isRunning) {
                const now = new Date();
                const defaultTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                const userTime = prompt("¿A qué hora fue tu última comida? (HH:MM):", defaultTime);
                
                if (userTime && userTime.includes(':')) {
                    const [h, m] = userTime.split(':');
                    const startDate = new Date();
                    startDate.setHours(parseInt(h), parseInt(m), 0);
                    if (startDate > new Date()) startDate.setDate(startDate.getDate() - 1);
                    localStorage.setItem('fast_start', startDate.getTime());
                    location.reload();
                }
            } else {
                if (confirm("¿Terminar misión?")) {
                    localStorage.removeItem('fast_start');
                    location.reload();
                }
            }
        }

        function updateUI() {
            const start = localStorage.getItem('fast_start');
            if (!start) return;

            isRunning = true;
            document.getElementById('action-btn').innerText = "FINALIZAR AYUNO";
            document.getElementById('action-btn').classList.replace('bg-emerald-600', 'bg-orange-700');
            document.getElementById('ai-box').classList.add('ai-glow');

            setInterval(() => {
                const diffSec = Math.floor((Date.now() - parseInt(start)) / 1000);
                const hours = diffSec / 3600;

                const h = Math.floor(hours).toString().padStart(2, '0');
                const m = Math.floor((diffSec % 3600) / 60).toString().padStart(2, '0');
                const s = (diffSec % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;

                const progress = Math.min(hours / 16, 1);
                document.getElementById('progress-bar').style.strokeDashoffset = ringLength - (progress * ringLength);
                
                const label = document.getElementById('phase-label');
                if (hours < 12) label.innerText = "Digestión";
                else if (hours < 16) label.innerText = "Quema Grasa";
                else label.innerText = "Autofagia";
            }, 1000);
        }

        window.onload = () => {
            const key = localStorage.getItem('fastquest_key');
            if (key) {
                document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-emerald-500');
                document.getElementById('status-text').innerText = "IA Conectada";
                document.getElementById('status-text').classList.replace('text-slate-500', 'text-emerald-500');
            }
            updateUI();
        };
    </script>
</body>
</html>
