<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest - Animated Pet Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #080c14; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Animación de Respiración de la Mascota */
        .pet-container { cursor: pointer; transition: transform 0.2s; position: relative; }
        .pet-container:active { transform: scale(0.9); }
        .pet-anim { animation: breathe 3s infinite ease-in-out; display: inline-block; }
        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(16,185,129,0.2)); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 10px 15px rgba(16,185,129,0.4)); }
        }

        /* Efecto de Corazón al tocar */
        .heart-effect {
            position: absolute; pointer-events: none; animation: floatUp 1s forwards;
            font-size: 1.5rem; opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        .progress-ring { transition: stroke-dashoffset 0.5s; transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-10">

    <!-- Header con Barra de XP -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-2">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="app_logo.png" class="w-12 h-12 rounded-2xl object-cover shadow-lg border border-emerald-500/20">
                <span id="level-badge" class="absolute -bottom-1 -right-1 bg-yellow-500 text-[9px] px-1.5 py-0.5 rounded-full text-black font-black">LVL 1</span>
            </div>
            <h1 class="text-xl font-bold text-emerald-400">FastQuest</h1>
        </div>
        <div class="w-24 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="xp-fill" class="bg-yellow-500 h-full transition-all duration-1000" style="width: 0%"></div>
        </div>
    </div>

    <!-- Mascota Interactiva Animada -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6 flex flex-col items-center gap-4 relative">
        <div id="pet-area" class="pet-container" onclick="petMascot(event)">
            <div id="pet-avatar" class="text-7xl pet-anim">🦊</div>
            <div id="effects-container"></div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-2xl border-t border-white/5 w-full">
            <p id="pet-bubble" class="text-center text-sm text-slate-200 italic">"¡Tócame para recibir un consejo!"</p>
        </div>
    </div>

    <!-- Timer Card -->
    <div class="glass p-6 rounded-[2.5rem] w-full max-w-md text-center mb-6">
        <div class="relative flex items-center justify-center mb-6">
            <svg class="w-56 h-56">
                <circle class="text-slate-800" stroke-width="10" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="10" stroke-dasharray="628" stroke-dashoffset="628" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
            </svg>
            <div class="absolute">
                <span id="timer" class="text-4xl font-light">00:00:00</span>
                <p id="phase-tag" class="text-[10px] text-emerald-400 font-bold uppercase mt-1">Inactivo</p>
            </div>
        </div>
        <button id="btn-action" class="w-full bg-emerald-600 py-4 rounded-2xl font-black text-sm tracking-widest shadow-xl active:scale-95 transition-all">
            INICIAR MISIÓN
        </button>
    </div>

    <!-- Modal Hora Inicio -->
    <div id="time-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-[3rem] w-full max-w-xs">
            <h3 class="text-xl font-bold mb-6">¿A qué hora empezaste?</h3>
            <input type="time" id="start-time-input" class="bg-slate-800 text-white text-4xl p-4 rounded-2xl w-full text-center mb-8 outline-none border border-emerald-500/50">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 text-slate-400">Cerrar</button>
                <button id="modal-confirm" class="flex-1 bg-emerald-600 py-4 rounded-xl font-bold">¡Vamos!</button>
            </div>
        </div>
    </div>

    <script>
        const petAvatar = document.getElementById('pet-avatar');
        const petBubble = document.getElementById('pet-bubble');
        const timerEl = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const circumference = 100 * 2 * Math.PI;
        
        let lastPhase = "";
        let isFasting = false;

        // --- LÓGICA DE NOTIFICACIONES ---
        function requestNotify() {
            if ("Notification" in window) {
                Notification.requestPermission();
            }
        }

        function sendNotify(title, body) {
            if (Notification.permission === "granted") {
                new Notification(title, { body: body, icon: 'app_logo.png' });
            }
        }

        // --- INTERACCIÓN MASCOTA ---
        function petMascot(e) {
            // Efecto visual
            const heart = document.createElement('div');
            heart.innerText = '❤️';
            heart.className = 'heart-effect';
            heart.style.left = `${e.offsetX}px`;
            document.getElementById('effects-container').appendChild(heart);
            setTimeout(() => heart.remove(), 1000);

            // Consejos aleatorios
            const tips = [
                "¡Bebe un vaso de agua ahora mismo!",
                "Si sientes hambre, prueba con té verde sin azúcar.",
                "¡Casi subes de nivel! No te rindas.",
                "¿Sabías que el hambre real solo dura 15 minutos?",
                "¡Eres una máquina de quemar grasa hoy!"
            ];
            petBubble.innerText = `"${tips[Math.floor(Math.random() * tips.length)]}"`;
        }

        function updateLogic() {
            const savedStart = localStorage.getItem('fastingStartTime');
            if(!savedStart) return;

            const startTime = new Date(parseInt(savedStart));
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);
            const hours = diff / 3600;

            // Timer y Progreso
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;
            
            const plan = parseInt(localStorage.getItem('fastingPlan') || 16);
            const progress = Math.min(diff / (plan * 3600), 1);
            progressBar.style.strokeDashoffset = circumference - (progress * circumference);
            document.getElementById('xp-fill').style.width = (progress * 100) + "%";

            // Fases Metabólicas y Notificaciones
            let currentPhase = "";
            if (hours < 12) {
                currentPhase = "Digestión";
                petAvatar.innerText = "🦊";
            } else if (hours < 16) {
                currentPhase = "Quema Grasa";
                petAvatar.innerText = "🐯";
            } else {
                currentPhase = "Autofagia";
                petAvatar.innerText = "🐲";
            }

            document.getElementById('phase-tag').innerText = currentPhase;

            // Notificar cambio de fase
            if (lastPhase !== currentPhase && lastPhase !== "") {
                sendNotify("¡Fase Alcanzada!", `Has entrado en la etapa de ${currentPhase}. ¡Sigue así!`);
            }
            lastPhase = currentPhase;
        }

        // --- BOTONES ---
        document.getElementById('btn-action').addEventListener('click', () => {
            if(!isFasting) {
                requestNotify();
                document.getElementById('time-modal').style.display = 'flex';
                const now = new Date();
                document.getElementById('start-time-input').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            } else {
                if(confirm("¿Finalizar misión?")) {
                    localStorage.removeItem('fastingStartTime');
                    location.reload();
                }
            }
        });

        document.getElementById('modal-confirm').addEventListener('click', () => {
            const [h, m] = document.getElementById('start-time-input').value.split(':');
            const start = new Date();
            start.setHours(h, m, 0);
            if(start > new Date()) start.setDate(start.getDate() - 1);
            localStorage.setItem('fastingStartTime', start.getTime());
            localStorage.setItem('fastingPlan', document.getElementById('plan')?.value || 16);
            location.reload();
        });

        function closeModal() { document.getElementById('time-modal').style.display = 'none'; }

        window.onload = () => {
            if(localStorage.getItem('fastingStartTime')) {
                isFasting = true;
                document.getElementById('btn-action').innerText = "FINALIZAR MISIÓN";
                setInterval(updateLogic, 1000);
                updateLogic();
            }
        };
    </script>
</body>
</html>
