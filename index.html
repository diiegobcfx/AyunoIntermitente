<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest AI - Fix Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #010409; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .ai-card { border: 2px solid #10b981; box-shadow: 0 0 50px rgba(16, 185, 129, 0.15); }
        .pet-anim { animation: breathe 4s infinite ease-in-out; cursor: pointer; }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .progress-ring { transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-12">

    <!-- Panel de Configuración -->
    <div id="setup-panel" class="fixed inset-0 z-50 glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-emerald-500/30 w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-4 text-emerald-400">AJUSTES DE CEREBRO</h2>
            <input type="password" id="api-input" placeholder="Pega tu clave gsk_ aquí" class="w-full bg-black border border-white/10 p-4 rounded-xl text-emerald-500 mb-4 outline-none">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold">GUARDAR Y REINICIAR</button>
            <button onclick="document.getElementById('setup-panel').classList.add('hidden')" class="mt-4 text-xs text-slate-500 uppercase">Cerrar</button>
        </div>
    </div>

    <!-- Header -->
    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4 px-2">
        <div class="flex flex-col">
            <span id="ai-label" class="text-[9px] font-black tracking-widest text-red-500 uppercase">Estado: Offline</span>
            <h1 class="text-xl font-black italic">FASTQUEST <span class="text-emerald-500">AI</span></h1>
        </div>
        <button onclick="document.getElementById('setup-panel').classList.remove('hidden')" class="text-xl">⚙️</button>
    </div>

    <!-- IA Module -->
    <div id="ai-container" class="glass ai-card w-full max-w-md p-8 rounded-[3rem] mb-6 flex flex-col items-center text-center relative">
        <div id="pet-avatar" class="text-8xl pet-anim mb-6" onclick="askExpertIA()">🦊</div>
        <div class="bg-black/40 p-5 rounded-2xl w-full border border-white/5 min-h-[100px] flex items-center justify-center">
            <p id="ai-bubble" class="text-sm font-medium leading-relaxed text-slate-200">"Toca mi cabeza para despertar la IA."</p>
        </div>
    </div>

    <!-- Timer UI -->
    <div class="glass p-10 rounded-[4rem] w-full max-w-md text-center">
        <div class="relative flex items-center justify-center mb-6">
            <svg class="w-56 h-56">
                <circle class="text-slate-900" stroke-width="12" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="12" stroke-dasharray="628" stroke-dashoffset="628" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
            </svg>
            <div class="absolute flex flex-col">
                <span id="timer" class="text-4xl font-light">00:00:00</span>
            </div>
        </div>
        <button id="main-btn" onclick="toggleQuest()" class="w-full bg-emerald-600 py-5 rounded-2xl font-black text-xs tracking-widest">INICIAR AYUNO</button>
    </div>

    <script>
        const circum = 628;
        let isFasting = false;

        function saveApiKey() {
            const rawKey = document.getElementById('api-input').value.trim(); // TRIM elimina espacios
            if(rawKey.startsWith('gsk_')) {
                localStorage.setItem('groq_secure_key', rawKey);
                location.reload();
            } else {
                alert("La clave debe empezar por gsk_");
            }
        }

        async function askExpertIA() {
            const key = localStorage.getItem('groq_secure_key');
            const bubble = document.getElementById('ai-bubble');
            
            if(!key) {
                bubble.innerText = "Error: No hay API Key configurada.";
                document.getElementById('setup-panel').classList.remove('hidden');
                return;
            }

            bubble.innerText = "Pensando...";
            
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "Eres un mentor biohacker. Responde en 10 palabras." },
                            { role: "user", content: "Dame un consejo de ayuno." }
                        ],
                        temperature: 0.5
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message); // Captura error real de Groq
                }
                
                bubble.innerText = `"${data.choices[0].message.content}"`;
            } catch (e) {
                console.error(e);
                bubble.innerText = "Error de conexión: Verifica que tu clave sea válida y tengas saldo.";
            }
        }

        function toggleQuest() {
            if (!isFasting) {
                localStorage.setItem('fastingStartTime', Date.now());
                location.reload();
            } else {
                localStorage.removeItem('fastingStartTime');
                location.reload();
            }
        }

        window.onload = () => {
            const key = localStorage.getItem('groq_secure_key');
            if(key) {
                document.getElementById('ai-label').innerText = "Estado: Conectado";
                document.getElementById('ai-label').classList.replace('text-red-500', 'text-emerald-500');
            }

            const saved = localStorage.getItem('fastingStartTime');
            if (saved) {
                isFasting = true;
                document.getElementById('main-btn').innerText = "FINALIZAR";
                document.getElementById('main-btn').classList.replace('bg-emerald-600', 'bg-orange-700');
                setInterval(() => {
                    const diff = Math.floor((Date.now() - parseInt(saved)) / 1000);
                    document.getElementById('timer').innerText = new Date(diff * 1000).toISOString().substr(11, 8);
                    document.getElementById('progress-bar').style.strokeDashoffset = circum - (Math.min(diff/57600, 1) * circum);
                }, 1000);
            }
        };
    </script>
</body>
</html>
