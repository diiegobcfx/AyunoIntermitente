<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastQuest - Ultra Notifications</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #05080f; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .pet-anim { animation: breathe 3s infinite ease-in-out; display: inline-block; cursor: pointer; }
        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px rgba(16,185,129,0.3)); }
            50% { transform: translateY(-12px) scale(1.05); filter: drop-shadow(0 15px 25px rgba(16,185,129,0.4)); }
        }
        .progress-ring { transition: stroke-dashoffset 0.8s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .calendar-day { aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: 0.3s; }
        .day-done { background: #10b981; color: #05080f; font-weight: 900; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-10">

    <!-- Header -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-4">
        <div class="flex items-center gap-3">
            <img src="app_logo.png" class="w-12 h-12 rounded-2xl object-cover border border-emerald-500/20">
            <h1 class="text-xl font-bold">FastQuest</h1>
        </div>
        <div class="bg-orange-500/10 px-3 py-1.5 rounded-full border border-orange-500/20">
            <span class="text-orange-500 font-bold text-sm">🔥 <span id="streak-val">0</span></span>
        </div>
    </div>

    <!-- Mascota con Diálogo Dinámico -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem] mb-6 flex flex-col items-center text-center relative">
        <div class="absolute top-4 right-4 bg-blue-500/20 px-2 py-1 rounded-lg border border-blue-500/30">
            <span class="text-[10px] text-blue-400 font-bold">💧 Agua: <span id="water-count">0</span></span>
        </div>
        <div class="pet-anim text-7xl mb-4" onclick="petInteraction(event)">🦊</div>
        <div class="bg-slate-900/60 p-4 rounded-2xl w-full">
            <p id="pet-bubble" class="text-sm text-slate-200 italic">"¡Permíteme notificarte para guiarte en tu misión!"</p>
        </div>
    </div>

    <!-- Timer Principal -->
    <div class="glass p-8 rounded-[3rem] w-full max-w-md text-center mb-6">
        <div class="relative flex items-center justify-center mb-8">
            <svg class="w-56 h-56">
                <circle class="text-slate-800" stroke-width="10" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                <circle id="progress-bar" class="text-emerald-500 progress-ring" stroke-width="10" stroke-dasharray="628" stroke-dashoffset="628" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
            </svg>
            <div class="absolute flex flex-col">
                <span id="timer" class="text-4xl font-light">00:00:00</span>
                <span id="phase-tag" class="text-[10px] font-bold text-emerald-500 uppercase mt-2">Listo</span>
            </div>
        </div>
        <button id="btn-action" class="w-full bg-emerald-600 py-4 rounded-2xl font-black text-sm tracking-widest active:scale-95 transition-all">
            INICIAR MISIÓN
        </button>
    </div>

    <!-- Historial -->
    <div class="glass w-full max-w-md p-6 rounded-[2.5rem]">
        <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
    </div>

    <!-- Modal Tiempo -->
    <div id="time-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden items-center justify-center p-6">
        <div class="glass p-8 rounded-[3rem] w-full max-w-xs text-center border border-emerald-500/20">
            <h3 class="text-xl font-bold mb-6">¿Cuándo empezaste?</h3>
            <input type="time" id="start-time-input" class="bg-slate-800 text-white text-4xl p-4 rounded-2xl w-full text-center mb-8 border border-emerald-500/50 outline-none">
            <button id="modal-confirm" class="w-full bg-emerald-600 py-4 rounded-xl font-bold">CONFIRMAR</button>
        </div>
    </div>

    <script>
        let isFasting = false;
        let notifiedWaterHours = 0;
        let notifiedPhases = new Set();
        const circum = 100 * 2 * Math.PI;

        // Gestión de Notificaciones
        function sendPush(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: body, icon: 'app_logo.png' });
            }
        }

        function updateLogic() {
            const start = localStorage.getItem('fastingStartTime');
            if(!start) return;

            const diff = Math.floor((new Date() - new Date(parseInt(start))) / 1000);
            const hours = diff / 3600;

            // Timer
            const h = Math.floor(diff/3600).toString().padStart(2, '0');
            const m = Math.floor((diff%3600)/60).toString().padStart(2, '0');
            const s = (diff%60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;

            // Notificaciones de Agua (Cada 2 horas)
            let waterCheck = Math.floor(hours / 2);
            if (waterCheck > notifiedWaterHours) {
                sendPush("💧 Hora de hidratarse", "Tu mascota te recuerda beber un vaso de agua para mantener el metabolismo activo.");
                notifiedWaterHours = waterCheck;
            }

            // Notificaciones de Fase
            const tag = document.getElementById('phase-tag');
            if (hours >= 12 && hours < 16 && !notifiedPhases.has('fat')) {
                sendPush("🔥 Quema de Grasa", "¡Felicidades! Tu cuerpo ha entrado en la fase de cetosis.");
                notifiedPhases.add('fat');
                tag.innerText = "Quema Grasa";
            } else if (hours >= 16 && !notifiedPhases.has('auto')) {
                sendPush("🧬 Autofagia Activada", "Tus células han comenzado su proceso de reparación profunda.");
                notifiedPhases.add('auto');
                tag.innerText = "Autofagia";
            }
            
            // UI Progress
            const progress = Math.min(diff / (16 * 3600), 1);
            document.getElementById('progress-bar').style.strokeDashoffset = circum - (progress * circum);
        }

        document.getElementById('btn-action').addEventListener('click', () => {
            if(!isFasting) {
                Notification.requestPermission(); // Solicitar permiso al iniciar[span_1](start_span)[span_1](end_span)
                document.getElementById('time-modal').style.display = 'flex';
            } else {
                if(confirm("¿Finalizar misión?")) {
                    const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
                    logs[new Date().getDate()] = true;
                    localStorage.setItem('fastingLogs', JSON.stringify(logs));
                    localStorage.removeItem('fastingStartTime');
                    location.reload();
                }
            }
        });

        document.getElementById('modal-confirm').addEventListener('click', () => {
            const [h, m] = document.getElementById('start-time-input').value.split(':');
            const d = new Date(); d.setHours(h, m, 0);
            if(d > new Date()) d.setDate(d.getDate()-1);
            localStorage.setItem('fastingStartTime', d.getTime());
            location.reload();
        });

        window.onload = () => {
            if(localStorage.getItem('fastingStartTime')) {
                isFasting = true;
                document.getElementById('btn-action').innerText = "TERMINAR MISIÓN";
                setInterval(updateLogic, 1000);
                updateLogic();
            }
            // Render calendario básico
            const grid = document.getElementById('calendar-grid');
            const logs = JSON.parse(localStorage.getItem('fastingLogs') || '{}');
            for(let i=1; i<=31; i++) {
                const day = document.createElement('div');
                day.className = `calendar-day ${logs[i] ? 'day-done' : 'bg-slate-900 text-slate-700'}`;
                day.innerText = i;
                grid.appendChild(day);
            }
        };
    </script>
</body>
</html>
